<!DOCTYPE html>
<html>
<head>
<title>Love Quiz ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="hearts"></div>

<!-- MESSAGE BOX -->
<div id="msgBox" class="msg-box">
  <div class="msg-content romantic-border">
    <p id="msgText"></p>
    <button onclick="closeMsg()">OK</button>
  </div>
</div>

<div class="container">

  <img src="left.jpg" class="side-img left">
  
  <div class="quiz-box">
  
    <p id="multiCount" style="display:none; margin-top:10px; font-weight:bold;"></p>
    <h2 id="question">Question here</h2>
    <div id="answers"></div>
    <p>Score: <span id="score">0</span></p>

    <div class="progress">
      <div id="loveBar"></div>
    </div>
  </div>

  <img src="right.jpg" class="side-img right">

</div>

<!-- SOUND FILES -->
<audio id="clickSound" src="click.mp3"></audio>
<audio id="correctSound" src="correct.mp3"></audio>
<audio id="wrongSound" src="wrong.mp3"></audio>


<!-- ❤️ LOVE MESSAGE SCREEN (FIRST SHOW) -->
<div id="loveMessageScreen" class="final-screen" style="display:none">
  <div class="final-content">
    <h1>❤️ Thangame ❤️</h1>
    <p>En Life La Vanthu Enna Heal Pannathukku Romba Thanks Thangame🤗</p>
    <p>Unakku oru small surprise iruku  wait pannu 😍</p>
    <button onclick="openFinalVideo()">See Surprise ❤️</button>
  </div>
</div>


<!-- 🎬 FINAL VIDEO SCREEN -->
<div id="finalScreen" class="final-screen" style="display:none">
  <div class="final-content">

    <h1>❤️ Thangame ❤️</h1>
    <p>I Love You💕</p>
<!-- ❤️ VIDEO WRAPPER -->
<div class="video-wrapper">

  <video id="loveVideo" controls>
    <source src="love.mp4" type="video/mp4">
  </video>

  <!-- ❤️ COUNTDOWN OVERLAY -->
  <div id="giftCountdown" class="gift-countdown">
    <p>Wait for your gift ❤️</p>
    <span id="giftTime">30</span>s
  </div>

</div>

    <button onclick="location.reload()">Replay ❤️</button>

  </div>
</div>
<!-- ❤️ COUNTDOWN GLOBAL OVERLAY -->
<div id="giftCountdown" class="gift-countdown">
  <p>Wait for your gift ❤️</p>
  <span id="giftTime">30</span>s
</div>

<script src="script.js"></script>

</body>
</html>
